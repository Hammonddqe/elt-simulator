<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ELT综合仿真训练器</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            background: #0a0c12;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .app-container {
            max-width: 550px;
            width: 100%;
            background: #12141c;
            border-radius: 48px;
            padding: 24px 20px 32px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.5);
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid #2a2e3c;
        }

        .title {
            color: white;
            font-weight: bold;
            font-size: 1.25rem;
        }

        .back-btn {
            background: #2a2e3c;
            border: none;
            color: white;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .mode-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .mode-btn {
            flex: 1;
            background: #1e212c;
            border: none;
            padding: 14px;
            border-radius: 32px;
            font-size: 1rem;
            font-weight: 600;
            color: #f0f3fa;
            cursor: pointer;
            transition: 0.1s;
        }

        .mode-btn:active {
            transform: scale(0.97);
        }

        .mode-btn.active {
            background: #ffaa44;
            color: #1a1c2a;
        }

        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 12px;
        }

        .menu-btn {
            background: #1e212c;
            border: none;
            padding: 16px 20px;
            border-radius: 32px;
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            color: #f0f3fa;
            cursor: pointer;
            transition: 0.1s;
        }

        .menu-btn:active {
            background: #2d3242;
            transform: scale(0.97);
        }

        .info-badge {
            background: #1a1e2c;
            margin-top: 28px;
            padding: 12px;
            border-radius: 28px;
            text-align: center;
            font-size: 0.75rem;
            color: #8e92a2;
        }

        .iframe-container {
            margin-top: 16px;
            border-radius: 24px;
            overflow: hidden;
            background: #0f111a;
            min-height: 550px;
        }

        .training-frame {
            width: 100%;
            min-height: 550px;
            height: auto;
            border: none;
            display: block;
        }

        .practice-result {
            margin-top: 16px;
            padding: 12px;
            border-radius: 24px;
            text-align: center;
            font-size: 0.85rem;
        }

        .result-success {
            background: #1a3a2a;
            color: #88ffaa;
            border: 1px solid #00cc66;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
<div class="app-container" id="appRoot"></div>

<script>
    // ==================== 预加载所有图片 ====================
    const PRELOAD_IMAGES = [
        // 波音1
        "b1coveroff-elton.webp",
        "b1coveron-elton-on.webp",
        "b1coveron-eltoff-arm.webp",
        "b1coveroff-eltoff-arm.webp",
        "b1_fault1_cover_closed_arm.webp",
        "b1_fault1_cover_open_arm.webp",
        "b1_fault1_cover_open_on.webp",
        "b1_fault1_cover_open_arm_ok.webp",
        "b1_fault1_cover_closed_arm_ok.webp",
        "b1_fault2_cover_closed_arm.webp",
        "b1_fault2_cover_open_arm.webp",
        "b1_fault2_cover_open_on.webp",
        "b1_fault2_cover_open_arm_ok.webp",
        "b1_fault2_cover_closed_arm_ok.webp",
        // 波音2
        "b2_cover_closed_on.webp",
        "b2_cover_closed_off.webp",
        "b2_cover_open_on.webp",
        "b2_cover_open_arm_on.webp",
        "b2_cover_open_arm_off.webp",
        "b2_cover_open_reset_on.webp",
        "b2_cover_open_reset_off.webp",
        // 空客1
        "a1_panel_on.webp",
        "a1_panel_arm.webp",
        "a1_panel_reset.webp",
        "a1_light_on.webp",
        // 空客2
        "a2_cover_closed_arm.webp",
        "a2_cover_open_arm.webp",
        "a2_cover_open_on.webp",
        "a2_light_on.webp",
        // 通用本体
        "elt_off_tx_on.webp",
        "elt_off_tx_off.webp",
        "elt_on_tx_on.webp"
    ];

    function preloadImages() {
        PRELOAD_IMAGES.forEach(src => {
            const img = new Image();
            img.src = src;
        });
        console.log("图片预加载已启动");
    }

    // 页面加载后执行预加载
    window.addEventListener('load', preloadImages);

    // ==================== 场景路径配置 ====================
    const SCENE_PATHS = {
        boeing1_normal: "boeing1_normal.html",
        boeing1_fault_type1: "boeing1_fault_type1.html",
        boeing1_fault_type2: "boeing1_fault_type2.html",
        boeing2_normal: "boeing2_normal.html",
        boeing2_fault_type1: "boeing2_fault_type1.html",
        airbus1_normal: "airbus1_normal.html",
        airbus1_fault_type1: "airbus1_fault_type1.html",
        airbus2_normal: "airbus2_normal.html",
        airbus2_fault_type1: "airbus2_fault_type1.html"
    };

    const SCENE_LIST = [
        { id: "boeing1_normal", name: "波音构型1 - 误触发" },
        { id: "boeing1_fault_type1", name: "波音构型1 - 故障触发类型1" },
        { id: "boeing1_fault_type2", name: "波音构型1 - 故障触发类型2" },
        { id: "boeing2_normal", name: "波音构型2 - 误触发" },
        { id: "boeing2_fault_type1", name: "波音构型2 - 故障触发类型1" },
        { id: "airbus1_normal", name: "空客构型1 - 误触发" },
        { id: "airbus1_fault_type1", name: "空客构型1 - 故障触发类型1" },
        { id: "airbus2_normal", name: "空客构型2 - 误触发" },
        { id: "airbus2_fault_type1", name: "空客构型2 - 故障触发类型1" }
    ];

    const AIRCRAFT_GROUPS = [
        {
            name: "波音构型 1",
            scenarios: [
                { id: "boeing1_normal", name: "误触发" },
                { id: "boeing1_fault_type1", name: "故障触发类型1" },
                { id: "boeing1_fault_type2", name: "故障触发类型2" }
            ]
        },
        {
            name: "波音构型 2",
            scenarios: [
                { id: "boeing2_normal", name: "误触发" },
                { id: "boeing2_fault_type1", name: "故障触发类型1" }
            ]
        },
        {
            name: "空客构型 1",
            scenarios: [
                { id: "airbus1_normal", name: "误触发" },
                { id: "airbus1_fault_type1", name: "故障触发类型1" }
            ]
        },
        {
            name: "空客构型 2",
            scenarios: [
                { id: "airbus2_normal", name: "误触发" },
                { id: "airbus2_fault_type1", name: "故障触发类型1" }
            ]
        },
        {
            name: "空客构型 3",
            scenarios: [
                { id: null, name: "待开发" }
            ]
        }
    ];

    let currentMode = "teach";
    let currentScreen = "modeSelect";
    let selectedAircraft = null;
    let selectedScenario = null;
    let practiceScenario = null;

    function getRandomScenario() {
        const availableScenarios = SCENE_LIST.filter(s => SCENE_PATHS[s.id]);
        const randomIndex = Math.floor(Math.random() * availableScenarios.length);
        return availableScenarios[randomIndex];
    }

    function render() {
        const root = document.getElementById('appRoot');

        // 1. 模式选择
        if (currentScreen === 'modeSelect') {
            root.innerHTML = `
                <div class="nav-bar">
                    <div class="title">✈️ ELT 仿真训练</div>
                    <div></div>
                </div>
                <div class="mode-selector">
                    <button class="mode-btn" id="teachModeBtn">📖 教程模式</button>
                    <button class="mode-btn" id="practiceModeBtn">🎯 练习模式</button>
                </div>
                <div class="info-badge">
                    教程模式：有提示教学<br>
                    练习模式：随机抽题，无任何提示
                </div>
            `;
            document.getElementById('teachModeBtn')?.addEventListener('click', () => {
                currentMode = "teach";
                currentScreen = "aircraftSelect";
                render();
            });
            document.getElementById('practiceModeBtn')?.addEventListener('click', () => {
                currentMode = "practice";
                practiceScenario = getRandomScenario();
                currentScreen = "training";
                render();
            });
            return;
        }

        // 2. 教程模式 - 构型选择
        if (currentScreen === 'aircraftSelect') {
            let aircraftHtml = '';
            AIRCRAFT_GROUPS.forEach((group, idx) => {
                aircraftHtml += `<button class="menu-btn" data-aircraft="${idx}">${group.name}</button>`;
            });
            root.innerHTML = `
                <div class="nav-bar">
                    <div class="title">📖 教程模式</div>
                    <button class="back-btn" id="backBtn">◀ 返回</button>
                </div>
                <div class="menu-grid">
                    ${aircraftHtml}
                </div>
                <div class="info-badge">
                    请选择 ELT 面板构型
                </div>
            `;
            document.getElementById('backBtn')?.addEventListener('click', () => {
                currentScreen = "modeSelect";
                render();
            });
            AIRCRAFT_GROUPS.forEach((group, idx) => {
                const btn = document.querySelector(`[data-aircraft="${idx}"]`);
                if (btn) {
                    btn.addEventListener('click', () => {
                        selectedAircraft = group;
                        currentScreen = "scenarioSelect";
                        render();
                    });
                }
            });
            return;
        }

        // 3. 教程模式 - 场景选择
        if (currentScreen === 'scenarioSelect') {
            let scenariosHtml = '';
            selectedAircraft.scenarios.forEach((scenario, idx) => {
                if (scenario.id && SCENE_PATHS[scenario.id]) {
                    scenariosHtml += `<button class="menu-btn" data-scenario="${scenario.id}">${scenario.name}</button>`;
                } else {
                    scenariosHtml += `<button class="menu-btn disabled" style="opacity:0.5;">${scenario.name} 🔜</button>`;
                }
            });
            root.innerHTML = `
                <div class="nav-bar">
                    <div class="title">📖 ${selectedAircraft.name}</div>
                    <button class="back-btn" id="backBtn">◀ 返回</button>
                </div>
                <div class="menu-grid">
                    ${scenariosHtml}
                </div>
                <div class="info-badge">
                    选择要学习的场景
                </div>
            `;
            document.getElementById('backBtn')?.addEventListener('click', () => {
                currentScreen = "aircraftSelect";
                render();
            });
            selectedAircraft.scenarios.forEach((scenario) => {
                if (!scenario.id) return;
                const btn = document.querySelector(`[data-scenario="${scenario.id}"]`);
                if (btn) {
                    btn.addEventListener('click', () => {
                        selectedScenario = scenario;
                        currentScreen = "training";
                        render();
                    });
                }
            });
            return;
        }

        // 4. 训练界面
        if (currentScreen === 'training') {
            let scenarioPath = null;
            let scenarioTitle = "";
            
            if (currentMode === "teach" && selectedScenario) {
                scenarioPath = SCENE_PATHS[selectedScenario.id];
                scenarioTitle = selectedScenario.name;
            } else if (currentMode === "practice" && practiceScenario) {
                scenarioPath = SCENE_PATHS[practiceScenario.id];
                scenarioTitle = "练习模式";
            }
            
            const finalPath = scenarioPath ? `${scenarioPath}?mode=${currentMode}` : '';
            
            root.innerHTML = `
                <div class="nav-bar">
                    <div class="title">${currentMode === "teach" ? `📖 ${scenarioTitle}` : '🎯 练习模式'}</div>
                    <button class="back-btn" id="backBtn">◀ 返回</button>
                </div>
                <div class="iframe-container">
                    <iframe class="training-frame" id="trainingFrame" src="${finalPath}" title="训练场景"></iframe>
                </div>
                <div class="practice-result hidden" id="practiceResult">
                    <div id="resultText"></div>
                </div>
                ${currentMode === "teach" ? '<div class="info-badge" style="margin-top:16px;">💡 教学模式：按照面板上的文字提示完成操作</div>' : ''}
            `;
            
            document.getElementById('backBtn')?.addEventListener('click', () => {
                if (currentMode === "teach") {
                    currentScreen = "scenarioSelect";
                } else {
                    currentScreen = "modeSelect";
                }
                render();
            });
            
            if (currentMode === "practice") {
                const frame = document.getElementById('trainingFrame');
                const resultDiv = document.getElementById('practiceResult');
                const resultText = document.getElementById('resultText');
                
                if (frame) {
                    const messageHandler = (event) => {
                        if (event.data && event.data.type === 'resetComplete') {
                            if (resultDiv && resultText) {
                                const scenarioName = practiceScenario ? practiceScenario.name : "未知场景";
                                resultText.innerHTML = `✅ 复位成功！<br>本轮场景：${scenarioName}<br>点击退出继续练习`;
                                resultDiv.classList.remove('hidden');
                                resultDiv.classList.add('result-success');
                            }
                            window.removeEventListener('message', messageHandler);
                        }
                    };
                    window.addEventListener('message', messageHandler);
                }
            }
            return;
        }
    }

    render();
</script>
</body>
</html>
