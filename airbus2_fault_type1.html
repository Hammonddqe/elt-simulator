<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>空客构型2 - 故障触发类型1</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            background: #0f111a;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .train-card {
            max-width: 500px;
            width: 100%;
            background: #12141c;
            border-radius: 48px;
            padding: 24px 20px 32px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.5);
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid #2a2e3c;
        }

        .title {
            color: white;
            font-weight: bold;
            font-size: 1.25rem;
        }

        .title-suffix {
            font-size: 0.9rem;
            color: #8e92a2;
        }

        .back-btn {
            display: none;
        }

        .panel-area {
            position: relative;
            display: flex;
            justify-content: center;
            border-radius: 24px;
            overflow: hidden;
            margin-top: 16px;
        }

        .panel-base-image {
            width: 100%;
            display: block;
            pointer-events: none;
            position: relative;
            z-index: 1;
        }

        .elt-light-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }
        .elt-light-overlay img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .hotspots {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        .hotspot {
            position: absolute;
            cursor: pointer;
            transition: all 0.1s;
            border-radius: 8px;
        }

        .hotspot.hint {
            border: 3px solid rgba(255, 200, 100, 0.9);
            background: rgba(255, 200, 100, 0.25);
            box-shadow: 0 0 8px rgba(255, 200, 100, 0.5);
        }

        .hotspot.disabled {
            display: none;
        }

        .feedback-card {
            background: #1e1e2a;
            border-radius: 24px;
            padding: 16px 20px;
            margin-top: 20px;
            text-align: center;
            min-height: 100px;
        }

        .step-badge {
            display: inline-block;
            background: #ffaa44;
            color: #1e1e2a;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .feedback-text {
            color: #e0e0e0;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .alarm-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #330000;
            border: 1px solid #ff4444;
            padding: 4px 12px;
            border-radius: 40px;
            margin-top: 10px;
            font-size: 0.7rem;
            color: #ff8888;
        }

        .reset-btn {
            width: 100%;
            background: #2a2a3a;
            border: none;
            padding: 12px;
            border-radius: 40px;
            color: white;
            font-size: 0.9rem;
            font-weight: bold;
            margin-top: 16px;
            cursor: pointer;
        }

        .start-btn {
            width: 100%;
            background: #ffaa44;
            border: none;
            padding: 14px;
            border-radius: 40px;
            color: #1a1c2a;
            font-size: 1rem;
            font-weight: bold;
            margin-top: 16px;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }

        html, body {
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* 练习模式隐藏所有提示 */
        .practice-mode .step-badge,
        .practice-mode .feedback-text,
        .practice-mode .title-suffix {
            display: none !important;
        }
    </style>
</head>
<body>
<div class="train-card" id="appRoot"></div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const isPracticeMode = urlParams.get('mode') === 'practice';
    
    if (isPracticeMode) {
        document.body.classList.add('practice-mode');
    }
    
    function renderAirbus2FaultType1() {
        const container = document.createElement('div');
        container.innerHTML = `
            <div class="nav-bar">
                <div class="title">
                    空客构型 2 <span class="title-suffix" id="titleSuffix">- 故障触发类型1</span>
                </div>
                <button class="back-btn" id="sceneBackBtn">◀ 返回</button>
            </div>
            <div class="panel-area" id="panelArea">
                <img class="panel-base-image" id="panelImage" alt="ELT控制面板">
                <div class="elt-light-overlay" id="lightOverlay">
                    <img id="lightImg" alt="ELT灯" style="width:100%; height:100%; object-fit: contain;">
                </div>
                <div class="hotspots" id="hotspotsLayer"></div>
            </div>
            <div class="feedback-card">
                <div class="step-badge" id="stepBadge">📋 提示</div>
                <div class="feedback-text" id="feedbackText">🔊 请点击【开始练习】激活声音并开始训练</div>
                <div class="alarm-badge" id="alarmBadge">🔴 警报发射中</div>
            </div>
            <button class="start-btn" id="startBtn">🔊 开始练习（激活声音）</button>
            <button class="reset-btn hidden" id="sceneResetBtn">🔄 重置场景</button>
        `;
        
        const panelImage = container.querySelector('#panelImage');
        const hotspotsLayer = container.querySelector('#hotspotsLayer');
        const panelArea = container.querySelector('#panelArea');
        const stepBadge = container.querySelector('#stepBadge');
        const feedbackText = container.querySelector('#feedbackText');
        const alarmBadge = container.querySelector('#alarmBadge');
        const startBtn = container.querySelector('#startBtn');
        const resetBtn = container.querySelector('#sceneResetBtn');
        const titleSuffix = container.querySelector('#titleSuffix');
        const lightOverlay = container.querySelector('#lightOverlay');
        const lightImg = container.querySelector('#lightImg');
        
        if (isPracticeMode && titleSuffix) {
            titleSuffix.style.display = 'none';
        }
        
        const PANEL_IMAGES = {
            COVER_CLOSED_ARM: "a2_cover_closed_arm.png"
        };
        
        const LIGHT_IMAGE = "a2_light_on.png";
        lightImg.src = LIGHT_IMAGE;
        
        let state = {
            coverOpen: false,
            switchPos: "ARM",
            eltActive: true,
            resetComplete: false,
            trainingActive: false,
            resetSeqTimer: null,
            lightBlinkTimer: null,
            beepOscillator: null,
            beepGain: null,
            beepAudioCtx: null
        };
        
        let resetButtonZone = null;
        
        function startBeep() {
            try {
                if (state.beepOscillator) {
                    try { state.beepOscillator.stop(); } catch(e) {}
                    state.beepOscillator = null;
                }
                if (state.beepAudioCtx) {
                    state.beepAudioCtx.close();
                }
                
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                state.beepAudioCtx = new AudioCtx();
                state.beepGain = state.beepAudioCtx.createGain();
                state.beepGain.gain.value = 0.15;
                state.beepGain.connect(state.beepAudioCtx.destination);
                
                state.beepOscillator = state.beepAudioCtx.createOscillator();
                state.beepOscillator.type = "sine";
                state.beepOscillator.frequency.value = 880;
                state.beepOscillator.connect(state.beepGain);
                state.beepOscillator.start();
                state.beepAudioCtx.resume();
            } catch(e) { console.log("蜂鸣音失败", e); }
        }
        
        function stopBeep() {
            try {
                if (state.beepOscillator) {
                    state.beepOscillator.stop();
                    state.beepOscillator = null;
                }
                if (state.beepGain) {
                    state.beepGain.disconnect();
                    state.beepGain = null;
                }
                if (state.beepAudioCtx) {
                    state.beepAudioCtx.close();
                    state.beepAudioCtx = null;
                }
            } catch(e) {}
        }
        
        function startResetSuccessFeedback() {
            stopLightBlink();
            
            let flashCount = 0;
            const flashInterval = setInterval(() => {
                if (flashCount >= 4) {
                    clearInterval(flashInterval);
                    lightOverlay.style.opacity = '0';
                    state.resetComplete = true;
                    state.eltActive = false;
                    updateUI();
                    playClickSound();
                    if (isPracticeMode && window.parent !== window) {
                        window.parent.postMessage({ type: 'resetComplete' }, '*');
                    }
                    return;
                }
                if (flashCount % 2 === 0) {
                    lightOverlay.style.opacity = '1';
                    startBeep();
                    setTimeout(() => stopBeep(), 150);
                } else {
                    lightOverlay.style.opacity = '0';
                }
                flashCount++;
            }, 250);
        }
        
        function startLightBlink() {
            stopLightBlink();
            lightOverlay.style.display = 'block';
            let isLightOn = true;
            lightOverlay.style.opacity = '1';
            startBeep();
            
            state.lightBlinkTimer = setInterval(() => {
                if (state.resetComplete || !state.eltActive || !state.trainingActive) {
                    return;
                }
                isLightOn = !isLightOn;
                lightOverlay.style.opacity = isLightOn ? '1' : '0';
                if (isLightOn) {
                    startBeep();
                } else {
                    stopBeep();
                }
            }, 500);
        }
        
        function stopLightBlink() {
            if (state.lightBlinkTimer) {
                clearInterval(state.lightBlinkTimer);
                state.lightBlinkTimer = null;
            }
            stopBeep();
        }
        
        function updatePanelImage() {
            if (!state.trainingActive) {
                panelImage.src = PANEL_IMAGES.COVER_CLOSED_ARM;
                return;
            }
            panelImage.src = PANEL_IMAGES.COVER_CLOSED_ARM;
        }
        
        function updateFeedbackText() {
            if (!state.trainingActive) {
                feedbackText.innerHTML = "🔊 请点击【开始练习】激活声音并开始训练";
                stepBadge.innerHTML = "📋 提示";
                return;
            }
            
            if (state.resetComplete) {
                feedbackText.innerHTML = '✅ 复位完成！ELT已停止发射';
                stepBadge.innerHTML = "✅ 复位完成";
                return;
            }
            
            feedbackText.innerHTML = "🔘 请点击【RESET】按钮完成复位";
            stepBadge.innerHTML = "📋 步骤 1/1";
        }
        
        function updateUI() {
            updatePanelImage();
            updateFeedbackText();
            
            if (!state.trainingActive) {
                alarmBadge.innerHTML = "⏸ 等待开始";
                alarmBadge.style.background = "#2a2a3a";
                alarmBadge.style.borderColor = "#888";
                alarmBadge.style.color = "#888";
                updateHotspotVisibility();
                return;
            }
            
            if (state.resetComplete) {
                alarmBadge.innerHTML = "✅ 警报已解除";
                alarmBadge.style.background = "#004d1a";
                alarmBadge.style.borderColor = "#00cc66";
                alarmBadge.style.color = "#88ffaa";
                updateHotspotVisibility();
                return;
            }
            
            if (state.eltActive && !state.resetComplete) {
                alarmBadge.innerHTML = "🔴 警报发射中";
                alarmBadge.style.background = "#330000";
                alarmBadge.style.borderColor = "#ff4444";
                alarmBadge.style.color = "#ff8888";
            } else {
                alarmBadge.innerHTML = "✅ 警报已解除";
                alarmBadge.style.background = "#004d1a";
                alarmBadge.style.borderColor = "#00cc66";
                alarmBadge.style.color = "#88ffaa";
            }
            
            updateHotspotVisibility();
        }
        
        function startTraining() {
            state.trainingActive = true;
            startBtn.classList.add('hidden');
            resetBtn.classList.remove('hidden');
            
            startLightBlink();
            updateUI();
        }
        
        function playClickSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = "sine";
                osc.frequency.value = 800;
                gain.gain.value = 0.1;
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.2);
                osc.stop(ctx.currentTime + 0.2);
                ctx.resume();
            } catch(e) {}
        }
        
        function updateHotspotVisibility() {
            if (!resetButtonZone) return;
            
            if (!state.trainingActive || state.resetComplete) {
                resetButtonZone.classList.add('disabled');
                return;
            }
            
            resetButtonZone.classList.remove('disabled');
        }
        
        function updateHotspotHints() {
            if (!resetButtonZone) return;
            resetButtonZone.classList.remove('hint');
            
            if (!state.trainingActive || state.resetComplete) return;
            
            resetButtonZone.classList.add('hint');
        }
        
        function setupHotspots() {
            hotspotsLayer.innerHTML = "";
            
            // RESET 按钮热区
            resetButtonZone = document.createElement('div');
            resetButtonZone.className = 'hotspot disabled';
            resetButtonZone.style.left = '77%';
            resetButtonZone.style.top = '47%';
            resetButtonZone.style.width = '8%';
            resetButtonZone.style.height = '12%';
            resetButtonZone.onclick = () => {
                if (!state.trainingActive) return;
                playClickSound();
                if (state.resetComplete) return;
                if (state.eltActive && !state.resetComplete) {
                    startResetSuccessFeedback();
                    updateUI();
                }
            };
            hotspotsLayer.appendChild(resetButtonZone);
            
            updateHotspotVisibility();
            updateHotspotHints();
        }
        
        function resetScenario() {
            if (state.resetSeqTimer) clearTimeout(state.resetSeqTimer);
            stopLightBlink();
            stopBeep();
            
            state = {
                coverOpen: false,
                switchPos: "ARM",
                eltActive: true,
                resetComplete: false,
                trainingActive: true,
                resetSeqTimer: null,
                lightBlinkTimer: null,
                beepOscillator: null,
                beepGain: null,
                beepAudioCtx: null
            };
            
            lightOverlay.style.display = 'block';
            startLightBlink();
            updateUI();
            playClickSound();
        }
        
        setupHotspots();
        updateUI();
        
        startBtn.onclick = () => {
            startTraining();
        };
        
        resetBtn.onclick = () => {
            resetScenario();
        };
        
        return container;
    }
    
    const root = document.getElementById('appRoot');
    root.innerHTML = '';
    root.appendChild(renderAirbus2FaultType1());
</script>
</body>
</html>
